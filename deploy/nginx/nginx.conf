server {
    listen       80;
    server_name  localhost;

    # Serve index.html without caching to ensure latest version
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # version.json drives the kiosk self-update check — must never be cached,
    # otherwise tablets would keep seeing the old build id after a deploy.
    location = /version.json {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # sw.js has no hash in its filename — exact-match location wins over the
    # regex below, which would otherwise mark it immutable for a year.
    location = /sw.js {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache static assets (JS, CSS) with versioned filenames for 1 year
    location ~* \.(js|css)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Default location for SPA routing
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
    }

    location /api {
        proxy_pass __BACKEND_URL__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # STOMP over SockJS — ruch WS idzie przez nginx tabletu (same-origin),
    # co omija blokadę CORS w Spring Security dla cross-origin WebSocket.
    # Origin jest nadpisywany na detailboost.pl, bo backend zezwala tylko
    # temu hostowi na połączenia STOMP (konfiguracja allowedOrigins po stronie Java).
    location /ws-registry {
        proxy_pass __BACKEND_URL__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Nadpisz Origin — backend akceptuje detailboost.pl, blokuje tablet.detailboost.pl.
        # Nginx-to-backend to połączenie serwer-serwer, więc ta zamiana jest bezpieczna.
        proxy_set_header Origin "https://detailboost.pl";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
